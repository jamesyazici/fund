[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqfc-dev"
version = "1.0.0"
description = "Thin client for the RQFC fund trading backend"
readme = "package/README.md"
requires-python = ">=3.9"
authors = [{ name = "RQFC" }]
dependencies = [
  "requests>=2.28.0",
]

[project.optional-dependencies]
# Needed only inside a strategy sandbox (rqfc._runtime). Keeps `pip install rqfc`
# light for students who just trade manually.
runtime = ["nats-py>=2.6.0"]

[project.scripts]
rqfc = "rqfc.cli:main"

[tool.setuptools]
package-dir = { "" = "package" }

[tool.setuptools.packages.find]
where = ["package"]
include = ["rqfc*"]
